<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پرداخت | نُوآ</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <a href="index.html" class="logo">نُوآ</a>
  <div class="header-actions" id="authArea"></div>
  <a href="cart.html" class="cart-btn">🛍 سبد <span class="cart-count" id="cartCount">۰</span></a>
</header>

<div class="container">
  <h1 class="page-title">تکمیل <span class="accent">سفارش</span></h1>
  <p class="page-subtitle">اطلاعات ارسال را وارد کنید</p>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:2rem;align-items:start;" class="checkout-layout">
    <form class="card" id="checkoutForm">
      <div class="form-group">
        <label>نام و نام خانوادگی</label>
        <input class="form-input" name="name" required />
      </div>
      <div class="form-group">
        <label>شماره تماس</label>
        <input class="form-input" name="phone" required placeholder="۰۹۱۲۳۴۵۶۷۸۹" />
      </div>
      <div class="form-group">
        <label>آدرس کامل</label>
        <textarea class="form-input" name="address" required placeholder="استان، شهر، خیابان، پلاک..."></textarea>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;">پرداخت و ثبت سفارش ✓</button>
      <p style="color:var(--muted);font-size:0.85rem;text-align:center;margin-top:1rem;">
        این یک پرداخت نمایشی است. درگاه واقعی (زرین‌پال) بعداً اضافه می‌شود.
      </p>
    </form>

    <div class="card">
      <h3 style="margin-bottom:1rem;">خلاصه سفارش</h3>
      <div id="summary"></div>
    </div>
  </div>
</div>

<footer>
  <div class="logo">نُوآ</div>
</footer>

<script src="app.js"></script>
<script>
  if (!requireAuth()) throw new Error('auth');

  async function loadSummary() {
    try {
      const items = await api('/cart');
      if (!items.length) { location.href = 'cart.html'; return; }
      const total = items.reduce((s, i) => s + i.price * i.quantity, 0);
      document.getElementById('summary').innerHTML = `
        ${items.map(i => `<div class="summary-row"><span>${i.emoji} ${i.name} × ${toPersian(i.quantity)}</span><span>${formatPrice(i.price * i.quantity)}</span></div>`).join('')}
        <div class="summary-row total"><span>مجموع</span><span>${formatPrice(total)} تومان</span></div>
      `;
    } catch (e) { toast(e.message, 'error'); }
  }

  document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = Object.fromEntries(fd.entries());
    try {
      const res = await api('/orders', { method: 'POST', body: JSON.stringify(body) });
      toast('سفارش با موفقیت ثبت شد ✓');
      renderHeader();
      setTimeout(() => location.href = 'orders.html', 900);
    } catch (err) { toast(err.message, 'error'); }
  });

  const style = document.createElement('style');
  style.textContent = '@media(max-width:768px){.checkout-layout{grid-template-columns:1fr!important;}}';
  document.head.appendChild(style);

  loadSummary();
</script>
</body>
</html>
